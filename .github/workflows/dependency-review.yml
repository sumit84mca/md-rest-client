name: Dependency review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Dependency review (phase 1 warn-only)
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
