name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Run optional quality scripts
        run: |
          SCRIPTS=$(node -e "const s=require('./package.json').scripts||{}; ['lint','test','typecheck'].filter(k=>s[k]).forEach(k=>console.log(k));")
          if [ -z "$SCRIPTS" ]; then
            echo "No optional quality scripts found (lint/test/typecheck)."
            exit 0
          fi
          for SCRIPT in $SCRIPTS; do
            echo "Running npm run $SCRIPT"
            npm run "$SCRIPT"
          done
